name: Deploy Contoso Hotel App

on:
  workflow_dispatch:

env:
  AZURE_REGION: "swedencentral"
  RESOURCE_GROUP: "rg-techexcelai"

  AZURE_SEARCH_SERVICE_NAME: "fwtechexcelaisrch"
  AZURE_AI_SEARCH_INDEX: "pdf"
  
  STORAGE_ACCOUNT_NAME: "fwtechexcelaistr"
  STORAGE_CONTAINER_NAME: "brochures"
  
  AZURE_OPENAI_SERVICE_NAME: "fwtechexcelaiaoai"
  AZURE_OPENAI_DEPLOYMENT_NAME_EMBEDDING: "ada-embedding"
  AZURE_OPENAI_DEPLOYMENT_NAME_GPT4: "gpt4"


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      ACR_NAME: "fwtechexcelai"
      CONTAINER_ENV: "fwcontosohotel"
      FRONTEND_IMAGE: "contosohotel-frontend"
      BACKEND_IMAGE: "contosohotel-backend"
      PROMPTFLOW_IMAGE: "contosohotel-promptflow"
      FRONTEND_PORT: 8000
      BACKEND_PORT: 8000
      PROMPTFLOW_PORT: 8080

      POSTGRES_PORT: 5432
      POSTGRES_SERVER_NAME: "contosohotel-postgres"
      POSTGRES_DB_NAME: "pycontosohotel"
      POSTGRES_ADMIN_USER: "contosoadmin"
      POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Azure using OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_TECH_EXCEL_AI_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Create Resource Group
      run: az group create --name $RESOURCE_GROUP --location $AZURE_REGION

    - name: Create Azure Container Registry
      run: |
        az acr create --resource-group $RESOURCE_GROUP --name $ACR_NAME --sku Standard --location $AZURE_REGION
        az acr login --name $ACR_NAME
        az acr update --name $ACR_NAME --anonymous-pull-enabled true

    - name: Build and push front-end image
      run: |
        cd ModernizedContosoHotel/FrontEnd
        docker build -t $ACR_NAME.azurecr.io/$FRONTEND_IMAGE:v1.0.0 .
        docker push $ACR_NAME.azurecr.io/$FRONTEND_IMAGE:v1.0.0

    - name: Build and push back-end image
      run: |
        cd ModernizedContosoHotel/BackEnd
        docker build -t $ACR_NAME.azurecr.io/$BACKEND_IMAGE:v1.0.0 .
        docker push $ACR_NAME.azurecr.io/$BACKEND_IMAGE:v1.0.0

    - name: Build and push promptflow image
      run: |
        cd TechExcel-Modernize-applications-to-be-AI-ready/Assets/docker-dist
        docker build -t $ACR_NAME.azurecr.io/$PROMPTFLOW_IMAGE:v1.0.0 .
        docker push $ACR_NAME.azurecr.io/$PROMPTFLOW_IMAGE:v1.0.0

    - name: Create PostgreSQL server
      run: |
        server_exists=$(az postgres flexible-server list --resource-group $RESOURCE_GROUP --output tsv)
        if [ -z "$server_exists" ]; then
          az postgres flexible-server create \
            --resource-group $RESOURCE_GROUP \
            --name $POSTGRES_SERVER_NAME \
            --admin-user $POSTGRES_ADMIN_USER \
            --admin-password $POSTGRES_ADMIN_PASSWORD \
            --location $AZURE_REGION \
            --tier Burstable \
            --sku-name Standard_B1ms \
            --storage-size 32 \
            --yes
        fi

    - name: Configure PostgreSQL firewall rules
      run: |
        az postgres flexible-server firewall-rule create \
          --resource-group $RESOURCE_GROUP \
          --name $POSTGRES_SERVER_NAME \
          --rule-name AllowAllAzureIPs \
          --start-ip-address 0.0.0.0 \
          --end-ip-address 255.255.255.255

    - name: Create PostgreSQL database
      run: |
        az postgres flexible-server db create \
          --resource-group $RESOURCE_GROUP \
          --server-name $POSTGRES_SERVER_NAME \
          --database-name $POSTGRES_DB_NAME

    - name: Get PostgreSQL connection string
      id: get-postgres-connection-string
      run: |
        POSTGRES_CONNECTION_STRING="user=$POSTGRES_ADMIN_USER;password=$POSTGRES_ADMIN_PASSWORD;host=$POSTGRES_SERVER_NAME.postgres.database.azure.com;port=5432;database=$POSTGRES_DB_NAME;"
        echo "POSTGRES_CONNECTION_STRING=$POSTGRES_CONNECTION_STRING" >> $GITHUB_ENV

    - name: Create Azure Storage Account
      run: |
        az storage account create --name $STORAGE_ACCOUNT_NAME --resource-group $RESOURCE_GROUP --location $AZURE_REGION --sku Standard_LRS

        # Assign the "Storage Blob Data Owner" role to the current user
        az role assignment create --assignee-object-id ${{ secrets.AZURE_TECH_EXCEL_AI_OBJECT_ID }} --assignee-principal-type ServicePrincipal --role "Storage Blob Data Owner" --scope /subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.Storage/storageAccounts/$STORAGE_ACCOUNT_NAME

    - name: Create Azure OpenAI Service
      run: |
        az cognitiveservices account create --name $AZURE_OPENAI_SERVICE_NAME \
        --resource-group $RESOURCE_GROUP --kind OpenAI --sku S0 --location $AZURE_REGION \
        --custom-domain $AZURE_OPENAI_SERVICE_NAME
        AZURE_OPENAI_ENDPOINT=$(az cognitiveservices account show --name $AZURE_OPENAI_SERVICE_NAME --resource-group $RESOURCE_GROUP --query endpoint --output tsv)
        echo "AZURE_OPENAI_ENDPOINT=$AZURE_OPENAI_ENDPOINT" >> $GITHUB_ENV
        AZURE_OPENAI_API_KEY=$(az cognitiveservices account keys list --name $AZURE_OPENAI_SERVICE_NAME --resource-group $RESOURCE_GROUP --query key1 --output tsv)
        echo "AZURE_OPENAI_API_KEY=$AZURE_OPENAI_API_KEY" >> $GITHUB_ENV

    - name: Deploy ADA Embedding Model
      run: |
        az cognitiveservices account deployment create --resource-group $RESOURCE_GROUP \
        --name $AZURE_OPENAI_SERVICE_NAME --deployment-name $AZURE_OPENAI_DEPLOYMENT_NAME_EMBEDDING \
        --model-name text-embedding-ada-002 --model-version 2 --model-format OpenAI \
        --sku Standard --capacity 50
    
    - name: Deploy GPT-3.5 Turbo Model
      run: |
        az cognitiveservices account deployment create --resource-group $RESOURCE_GROUP \
        --name $AZURE_OPENAI_SERVICE_NAME --deployment-name $AZURE_OPENAI_DEPLOYMENT_NAME_GPT4 \
        --model-name gpt-35-turbo --model-version 0125 --model-format OpenAI \
        --sku Standard --capacity 50

    - name: Upload PDF files to Azure Storage Container
      run: |
        az storage container create --name $STORAGE_CONTAINER_NAME --account-name $STORAGE_ACCOUNT_NAME --auth-mode login
        az storage blob upload-batch --account-name $STORAGE_ACCOUNT_NAME --destination $STORAGE_CONTAINER_NAME --source "TechExcel-Modernize-applications-to-be-AI-ready/Assets/PDFs" --pattern "*.pdf" --auth-mode login && break
  
    - name: Create Azure AI Search Service
      run: |
        az search service create --name $AZURE_SEARCH_SERVICE_NAME --resource-group $RESOURCE_GROUP --sku Standard --location $AZURE_REGION \
          --identity-type SystemAssigned \
          --auth-options aadOrApiKey \
          --aad-auth-failure-mode http401WithBearerChallenge

        # Assign the "Storage Blob Data Reader" role to Azure AI Search
        az role assignment create --assignee-object-id $(az search service show --name $AZURE_SEARCH_SERVICE_NAME --resource-group $RESOURCE_GROUP --query identity.principalId --output tsv) \
          --assignee-principal-type ServicePrincipal \
          --role "Storage Blob Data Reader" \
          --scope /subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.Storage/storageAccounts/$STORAGE_ACCOUNT_NAME
        
        # Assign the "Cognitive Services OpenAI User" role to Azure AI Search
        az role assignment create --assignee-object-id $(az search service show --name $AZURE_SEARCH_SERVICE_NAME --resource-group $RESOURCE_GROUP --query identity.principalId --output tsv) \
          --assignee-principal-type ServicePrincipal \
          --role "Cognitive Services OpenAI User" \
          --scope /subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.CognitiveServices/accounts/$AZURE_OPENAI_SERVICE_NAME

        AZURE_AI_SEARCH_ENDPOINT=$(az search service show --name $AZURE_SEARCH_SERVICE_NAME --resource-group $RESOURCE_GROUP --query endpoint --output tsv)
        echo "AZURE_AI_SEARCH_ENDPOINT=$AZURE_AI_SEARCH_ENDPOINT" >> $GITHUB_ENV
        AZURE_AI_SEARCH_API_KEY=$(az search admin-key show --service-name $AZURE_SEARCH_SERVICE_NAME --resource-group $RESOURCE_GROUP --query primaryKey --output tsv)
        echo "AZURE_AI_SEARCH_API_KEY=$AZURE_AI_SEARCH_API_KEY" >> $GITHUB_ENV

    - name: Deploy Azure Container Environment
      run: |
        az containerapp env create --name $CONTAINER_ENV --resource-group $RESOURCE_GROUP --location $AZURE_REGION

    - name: Deploy promptflow container
      run: |
        az containerapp create --name promptflow --resource-group $RESOURCE_GROUP \
        --environment $CONTAINER_ENV --image $ACR_NAME.azurecr.io/$PROMPTFLOW_IMAGE:v1.0.0 \
        --target-port $PROMPTFLOW_PORT --ingress external \
        --env-vars AZURE_OPENAI_ENDPOINT=$AZURE_OPENAI_ENDPOINT \
        AZURE_OPENAI_API_KEY=$AZURE_OPENAI_API_KEY \
        AZURE_AI_SEARCH_ENDPOINT=$AZURE_AI_SEARCH_ENDPOINT \
        AZURE_AI_SEARCH_API_KEY=$AZURE_AI_SEARCH_API_KEY \
        AZURE_AI_SEARCH_INDEX=$AZURE_AI_SEARCH_INDEX \
        PGHOST=$POSTGRES_SERVER_NAME.postgres.database.azure.com \
        PGPORT=$POSTGRES_PORT \
        PGUSER=$POSTGRES_ADMIN_USER \
        PGDATABASE=$POSTGRES_DB_NAME \
        PGPASSWORD=$POSTGRES_ADMIN_PASSWORD
        CHATBOT_BASEURL="https://$(az containerapp show --resource-group $RESOURCE_GROUP --name promptflow --query properties.configuration.ingress.fqdn -o tsv)"
        echo "CHATBOT_BASEURL=$CHATBOT_BASEURL" >> $GITHUB_ENV

    - name: Deploy back-end container
      run: |
        az containerapp create --name backend --resource-group $RESOURCE_GROUP --environment $CONTAINER_ENV --image $ACR_NAME.azurecr.io/$BACKEND_IMAGE:v1.0.0 --target-port $BACKEND_PORT --ingress external --env-vars POSTGRES_CONNECTION_STRING=$POSTGRES_CONNECTION_STRING CHATBOT_BASEURL=$CHATBOT_BASEURL
        BACKEND_URL="https://$(az containerapp show --resource-group $RESOURCE_GROUP --name backend --query properties.configuration.ingress.fqdn -o tsv)"
        echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_ENV

    - name: Deploy front-end container
      run: |
        az containerapp create --name frontend --resource-group $RESOURCE_GROUP --environment $CONTAINER_ENV --image $ACR_NAME.azurecr.io/$FRONTEND_IMAGE:v1.0.0 --target-port $FRONTEND_PORT --ingress external --env-vars API_BASEURL=$BACKEND_URL CHATBOT_BASEURL=$CHATBOT_BASEURL
        FRONTEND_URL="https://$(az containerapp show --resource-group $RESOURCE_GROUP --name frontend --query properties.configuration.ingress.fqdn -o tsv)"
        echo "FRONTEND_URL=$FRONTEND_URL" >> $GITHUB_ENV

    - name: Update backend CORS settings
      run: |
        az containerapp ingress cors enable --name backend --resource-group $RESOURCE_GROUP \
         --allowed-origins $FRONTEND_URL --allowed-methods PUT POST

  index-data:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 'Az CLI login'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_TECH_EXCEL_AI_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Retrieve Storage Account Resource ID and Azure OpenAI Endpoint and Key
        id: storage_account_id
        run: |
          AZURE_STORAGE_RESOURCE_ID=$(az storage account show --name ${{ env.STORAGE_ACCOUNT_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --query id --output tsv)
          echo "AZURE_STORAGE_RESOURCE_ID=$AZURE_STORAGE_RESOURCE_ID" >> $GITHUB_ENV
          AZURE_OPENAI_ENDPOINT=$(az cognitiveservices account show --name $AZURE_OPENAI_SERVICE_NAME --resource-group $RESOURCE_GROUP --query properties.endpoint --output tsv)
          echo "AZURE_OPENAI_ENDPOINT=$AZURE_OPENAI_ENDPOINT" >> $GITHUB_ENV
          
      - name: Create DataSources
        run: |
          # Create a datasource for the pdf data
          curl --request PUT \
            --url 'https://${{ env.AZURE_SEARCH_SERVICE_NAME }}.search.windows.net/datasources(%27pdf-datasource%27)?api-version=2024-07-01' \
            --header "authorization: Bearer $(az account get-access-token --scope https://search.azure.com/.default | jq -r .'accessToken')" \
            --header 'content-type: application/json' \
            --header 'user-agent: github-actions' \
            --data '{"name" : "pdf-datasource","type" : "azureblob","credentials" : { "connectionString" : "ResourceId='$AZURE_STORAGE_RESOURCE_ID';" },"container" : { "name" : "brochures", "query" : null }}'
          
      - name: Create Indices
        run: |
          # Create an index for the pdf data
          curl --request POST \
            --verbose \
            --url 'https://${{ env.AZURE_SEARCH_SERVICE_NAME }}.search.windows.net/indexes?api-version=2024-07-01' \
            --header "authorization: Bearer $(az account get-access-token --scope https://search.azure.com/.default | jq -r .'accessToken')" \
            --header 'content-type: application/json' \
            --header 'user-agent: github-actions' \
            --data '{"name": "pdf-index","fields": [{"name": "chunk_id","type": "Edm.String","searchable": true,"filterable": false,"retrievable": true,"stored": true,"sortable": true,"facetable": false,"key": true,"analyzer": "keyword","synonymMaps": []},{"name": "parent_id","type": "Edm.String","searchable": false,"filterable": true,"retrievable": true,"stored": true,"sortable": false,"facetable": false,"key": false,"synonymMaps": []},{"name": "chunk","type": "Edm.String","searchable": true,"filterable": false,"retrievable": true,"stored": true,"sortable": false,"facetable": false,"key": false,"synonymMaps": []},{"name": "title","type": "Edm.String","searchable": true,"filterable": false,"retrievable": true,"stored": true,"sortable": false,"facetable": false,"key": false,"synonymMaps": []},{"name": "text_vector","type": "Collection(Edm.Single)","searchable": true,"filterable": false,"retrievable": true,"stored": true,"sortable": false,"facetable": false,"key": false,"dimensions": 1536,"vectorSearchProfile": "pdf-azureOpenAi-text-profile","synonymMaps": []}],"scoringProfiles": [],"suggesters": [],"analyzers": [],"tokenizers": [],"tokenFilters": [],"charFilters": [],"similarity": {"@odata.type": "#Microsoft.Azure.Search.BM25Similarity"},"semantic": {"defaultConfiguration": "pdf-semantic-configuration","configurations": [{"name": "pdf-semantic-configuration","prioritizedFields": {"titleField": {"fieldName": "title"},"prioritizedContentFields": [{"fieldName": "chunk"}],"prioritizedKeywordsFields": []}}]},"vectorSearch": {"algorithms": [{"name": "pdf-algorithm","kind": "hnsw","hnswParameters": {"metric": "cosine","m": 4,"efConstruction": 400,"efSearch": 500}}],"profiles": [{"name": "pdf-azureOpenAi-text-profile","algorithm": "pdf-algorithm","vectorizer": "pdf-azureOpenAi-text-vectorizer"}],"vectorizers": [{"name": "pdf-azureOpenAi-text-vectorizer","kind": "azureOpenAI","azureOpenAIParameters": {"resourceUri": "'$AZURE_OPENAI_ENDPOINT'","deploymentId": "ada-embedding","modelName": "text-embedding-ada-002"}}],"compressions": []}}'

      - name: Create Indexing Embedding Skill
        run: |
          # Create an indexing skill for the pdf data to extract embeddings via Azure OpenAI Service Embeddings model
          curl --request POST \
            --verbose \
            --url 'https://${{ env.AZURE_SEARCH_SERVICE_NAME }}.search.windows.net/skillsets?api-version=2024-07-01' \
            --header "authorization: Bearer $(az account get-access-token --scope https://search.azure.com/.default | jq -r .'accessToken')" \
            --header 'content-type: application/json' \
            --header 'user-agent: github-actions' \
            --data '{"name": "pdf-skillset","description": "Skillset to chunk documents and generate embeddings","skills": [{"@odata.type": "#Microsoft.Skills.Text.SplitSkill","name": "#1","description": "Split skill to chunk documents","context": "/document","defaultLanguageCode": "en","textSplitMode": "pages","maximumPageLength": 2000,"pageOverlapLength": 500,"maximumPagesToTake": 0,"inputs": [{"name": "text","source": "/document/content","inputs": []}],"outputs": [{"name": "textItems","targetName": "pages"}]},{"@odata.type": "#Microsoft.Skills.Text.AzureOpenAIEmbeddingSkill","name": "#2","context": "/document/pages/*","resourceUri": "'$AZURE_OPENAI_ENDPOINT'","deploymentId": "ada-embedding","dimensions": 1536,"modelName": "text-embedding-ada-002","inputs": [{"name": "text","source": "/document/pages/*","inputs": []}],"outputs": [{"name": "embedding","targetName": "text_vector"}]}],"indexProjections": {"selectors": [{"targetIndexName": "pdf-index","parentKeyFieldName": "parent_id","sourceContext": "/document/pages/*","mappings": [{"name": "text_vector","source": "/document/pages/*/text_vector","inputs": []},{"name": "chunk","source": "/document/pages/*","inputs": []},{"name": "title","source": "/document/title","inputs": []}]}],"parameters": {"projectionMode": "skipIndexingParentDocuments"}}}'
  
      - name: Create Indexers
        run: |
          # Create an indexer for the pdf data, will directly run once
          curl --request POST \
            --verbose \
            --url 'https://${{ env.AZURE_SEARCH_SERVICE_NAME }}.search.windows.net/indexers?api-version=2024-07-01' \
            --header "authorization: Bearer $(az account get-access-token --scope https://search.azure.com/.default | jq -r .'accessToken')" \
            --header 'content-type: application/json' \
            --header 'user-agent: github-actions' \
            --data '{"name": "pdf-indexer","description": null,"dataSourceName": "pdf-datasource","skillsetName": "pdf-skillset","targetIndexName": "pdf-index","disabled": null,"schedule": null,"parameters": {"batchSize": null,"maxFailedItems": null,"maxFailedItemsPerBatch": null,"base64EncodeKeys": null,"configuration": {"dataToExtract": "contentAndMetadata","parsingMode": "default"}},"fieldMappings": [{"sourceFieldName": "metadata_storage_name","targetFieldName": "title","mappingFunction": null}],"outputFieldMappings": [],"encryptionKey": null}'